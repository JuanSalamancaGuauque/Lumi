<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lumi</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>

    <main class="lumi-app">


        <!-- =====================================================
             ESCENARIO / MASCOTA
        ====================================================== -->

        <section class="lumi-header">

            <!-- Capa 1: árboles de fondo -->
            <img
                class="lumi-trees"
                src="/static/images/arboles%20fondo%20lumi.png"
                alt=""
                aria-hidden="true"
            >

            <!-- Capa 2: Lumi (animaciones). Va DETRÁS de la casita -->
            <div
                id="lumi-avatar"
                class="lumi-avatar"
            >
                <img
                    id="lumi-avatar-image"
                    src="/static/images/SALUDO%20LUMI.gif"
                    alt="Lumi"
                >
            </div>

            <!-- Capa 3: casita (un solo PNG para celular y escritorio) -->
            <div class="lumi-house">
                <img
                    src="/static/images/casita%20lumi%20pc.png"
                    alt="Casita de Lumi"
                >
            </div>

        </section>

        <!-- Degradado de profundidad entre escenario y chat -->
        <div class="lumi-shade" aria-hidden="true"></div>



        <!-- =====================================================
             CHAT
        ====================================================== -->

        <section
            id="chatContainer"
            class="chat-container"
        >


            <div class="chat-messages">


                <!-- MENSAJE INICIAL -->

                <div
                    id="welcome-message"
                    class="lumi-response welcome-message"
                >
                    ¡Hola! Soy Lumi.
                    <br>
                    Pregúntame algo sobre Bogotá.
                </div>


                <!-- RESPUESTAS -->

                <div
                    id="response"
                    class="response-container"
                ></div>


            </div>


        </section>



        <!-- =====================================================
             BARRA DE TEXTO
        ====================================================== -->

        <div class="input-area">


            <div class="input-wrapper">


                <!-- MICRÓFONO -->

                <button
                    id="mic"
                    class="mic-button"
                    type="button"
                    aria-label="Hablar con Lumi"
                >
                    <svg class="mic-icon" viewBox="0 0 22 26" aria-hidden="true">
                        <rect x="7" y="1" width="8" height="14" rx="4" fill="currentColor"/>
                        <path d="M2.5 11.5a8.5 8.5 0 0 0 17 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                        <line x1="11" y1="20" x2="11" y2="25" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                    </svg>
                    <span class="rec-dot" aria-hidden="true"></span>
                </button>


                <!-- INPUT -->

                <input
                    id="message"
                    type="text"
                    placeholder="Soy Lumi! Pregúntame algo..."
                    autocomplete="off"
                >


            </div>


            <!-- ENVIAR -->

            <button
                id="send"
                class="send-button"
                type="button"
                aria-label="Enviar mensaje"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 3.5L21.5 12L3 20.5L7.5 12Z" fill="#EFEFEF" stroke="#EFEFEF" stroke-width="1.6" stroke-linejoin="round"/>
                </svg>
            </button>


        </div>


    </main>



    <!-- =========================================================
         MODAL DE IMAGEN
    ========================================================== -->

    <div
        id="imageModal"
        class="image-modal"
        aria-hidden="true"
    >


        <button
            id="closeModal"
            class="close-modal"
            type="button"
            aria-label="Cerrar imagen"
        >

            <img
                src="/static/images/quitar%20lumi.png"
                alt="Cerrar"
            >

        </button>


        <div class="modal-content">


            <div class="modal-image-wrapper">

                <div class="modal-loading">
                    Cargando imagen...
                </div>

                <img
                    id="modalImage"
                    src=""
                    alt="Lugar recomendado"
                >

            </div>


            <div class="modal-info">

                <h2 id="modalTitle"></h2>

                <p id="modalDescription"></p>

            </div>


        </div>


    </div>



    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script
        src="/js/api.js"
        defer
    ></script>

    <script
        src="/js/app.js"
        defer
    ></script>

    <script
        src="/js/speech.js"
        defer
    ></script>

    <!-- Herramienta de ajuste: solo se activa con ?tune en la URL.
         Puedes borrar esta línea cuando termines de ajustar. -->
    <script
        src="/js/tuner.js"
        defer
    ></script>


</body>

</html>
