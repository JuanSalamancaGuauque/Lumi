<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lumi</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>

    <main class="lumi-app">


        <!-- =====================================================
             ESCENARIO / MASCOTA
        ====================================================== -->

        <section class="lumi-header">


            <!-- Fondo de árboles -->
            <img
                class="lumi-trees"
                src="/static/images/arboles%20fondo%20lumi.png"
                alt=""
                aria-hidden="true"
            >


            <!-- Casita -->
            <picture class="lumi-house">

                <source
                    media="(min-width: 900px)"
                    srcset="/static/images/casita%20lumi%20pc.png"
                >

                <img
                    src="/static/images/casita%20lumi%20cel.png"
                    alt="Casita de Lumi"
                >

            </picture>


            <!-- Logo -->
            <div class="lumi-logo">

                <span class="logo-dot"></span>

                <span class="logo-text">
                    LUMI
                </span>

                <span class="logo-dot"></span>

            </div>


            <!-- =================================================
                 GIF DE LUMI
            ================================================== -->

            <div
                id="lumi-avatar"
                class="lumi-avatar"
            >

                <img
                    id="lumi-avatar-image"
                    src="/static/images/SALUDO%20LUMI.gif"
                    alt="Lumi"
                >

            </div>


        </section>



        <!-- =====================================================
             CHAT
        ====================================================== -->

        <section
            id="chatContainer"
            class="chat-container"
        >


            <div class="chat-messages">


                <!-- MENSAJE INICIAL -->

                <div
                    id="welcome-message"
                    class="lumi-response welcome-message"
                >
                    ¡Hola! Soy Lumi.
                    <br>
                    Pregúntame algo sobre Bogotá.
                </div>


                <!-- RESPUESTAS -->

                <div
                    id="response"
                    class="response-container"
                ></div>


            </div>


        </section>



        <!-- =====================================================
             BARRA DE TEXTO
        ====================================================== -->

        <div class="input-area">


            <div class="input-wrapper">


                <!-- MICRÓFONO -->

                <button
                    id="mic"
                    class="mic-button"
                    type="button"
                    aria-label="Hablar con Lumi"
                >
                    🎙
                </button>


                <!-- INPUT -->

                <input
                    id="message"
                    type="text"
                    placeholder="Soy Lumi! Pregúntame algo..."
                    autocomplete="off"
                >


            </div>


            <!-- ENVIAR -->

            <button
                id="send"
                class="send-button"
                type="button"
                aria-label="Enviar mensaje"
            >
                ➤
            </button>


        </div>


    </main>



    <!-- =========================================================
         MODAL DE IMAGEN
    ========================================================== -->

    <div
        id="imageModal"
        class="image-modal"
        aria-hidden="true"
    >


        <button
            id="closeModal"
            class="close-modal"
            type="button"
            aria-label="Cerrar imagen"
        >

            <img
                src="/static/images/quitar%20lumi.png"
                alt="Cerrar"
            >

        </button>


        <div class="modal-content">


            <div class="modal-image-wrapper">

                <div class="modal-loading">
                    Cargando imagen...
                </div>

                <img
                    id="modalImage"
                    src=""
                    alt="Lugar recomendado"
                >

            </div>


            <div class="modal-info">

                <h2 id="modalTitle"></h2>

                <p id="modalDescription"></p>

            </div>


        </div>


    </div>



    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script
        src="/js/api.js"
        defer
    ></script>

    <script
        src="/js/app.js"
        defer
    ></script>

    <script
        src="/js/speech.js"
        defer
    ></script>


</body>

</html>
