<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lumi</title>

    <!-- IMPORTANTE:
         Flask sirve el CSS mediante /css/
    -->

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>

    <main class="lumi-app">


        <!-- =================================================
             PARTE SUPERIOR
        ================================================== -->

        <section class="lumi-header">


            <!-- Fondo -->

            <div class="background-shape shape-one"></div>

            <div class="background-shape shape-two"></div>


            <!-- Árboles -->

            <div class="tree tree-one"></div>

            <div class="tree tree-two"></div>

            <div class="tree tree-three"></div>

            <div class="tree tree-four"></div>


            <!-- =================================================
                 LOGO
            ================================================== -->

            <div class="lumi-logo">

                <span class="logo-dot"></span>

                <span class="logo-text">
                    LUMI
                </span>

                <span class="logo-dot"></span>

            </div>


            <!-- =================================================
                 ACCESIBILIDAD (pilar del QTA)
            ================================================== -->

            <div class="accessibility-bar">

                <button
                    id="toggle-text-size"
                    class="accessibility-button"
                    type="button"
                    aria-pressed="false"
                    aria-label="Aumentar tamaño de texto"
                    title="Texto grande"
                >
                    A+
                </button>

                <button
                    id="toggle-contrast"
                    class="accessibility-button"
                    type="button"
                    aria-pressed="false"
                    aria-label="Alto contraste"
                    title="Alto contraste"
                >
                    ◐
                </button>

            </div>


            <!-- =================================================
                 GIF DE LUMI (mediador visual/emocional)
            ================================================== -->

            <div
                id="lumi-avatar"
                class="lumi-avatar"
            >

                <!--
                    El <img> se crea dinamicamente desde avatar.js
                    (ver setAvatarState). Aqui no ponemos nada fijo
                    porque el GIF cambia segun el estado de la
                    conversacion (saludo, pensando, hablando, etc).
                -->

            </div>


        </section>


        <!-- =================================================
             CHAT
        ================================================== -->

        <section class="chat-container">


            <!-- MENSAJE INICIAL -->

            <div
                id="welcome-message"
                class="lumi-response welcome-message"
            >

                ¡Hola! Soy Lumi.
                <br>
                Pregúntame algo sobre Bogotá.

            </div>


            <!-- RESPUESTAS -->

            <div
                id="response"
                class="response-container"
            >

            </div>


        </section>


        <!-- =================================================
             BARRA DE TEXTO
        ================================================== -->

        <div class="input-area">


            <div class="input-wrapper">


                <!-- MICRÓFONO -->

                <button
                    id="mic"
                    class="mic-button"
                    type="button"
                    aria-label="Hablar con Lumi"
                >

                    🎙

                </button>


                <!-- TEXTO -->

                <input
                    id="message"
                    type="text"
                    placeholder="Soy Lumi! Pregúntame algo..."
                    autocomplete="off"
                >


            </div>


            <!-- ENVIAR -->

            <button
                id="send"
                class="send-button"
                type="button"
                aria-label="Enviar mensaje"
            >

                ➤

            </button>


        </div>


    </main>


    <!-- =================================================
         MODAL DE IMAGEN
    ================================================== -->

    <div
        id="imageModal"
        class="image-modal"
    >

        <button
            id="closeModal"
            class="close-modal"
            type="button"
        >

            ×

        </button>


        <div class="modal-content">

            <img
                id="modalImage"
                src=""
                alt="Lugar"
            >


            <div class="modal-info">

                <h2 id="modalTitle"></h2>

                <p id="modalDescription"></p>

            </div>

        </div>

    </div>


    <!-- =================================================
         JAVASCRIPT

         IMPORTANTE:
         Flask los sirve mediante /js/

         avatar.js va PRIMERO porque app.js y speech.js
         llaman a su función setAvatarState().
    ================================================== -->

    <script
        src="/js/avatar.js"
        defer
    ></script>

    <script
        src="/js/accessibility.js"
        defer
    ></script>

    <script
        src="/js/api.js"
        defer
    ></script>

    <script
        src="/js/app.js"
        defer
    ></script>

    <script
        src="/js/speech.js"
        defer
    ></script>


</body>

</html>
